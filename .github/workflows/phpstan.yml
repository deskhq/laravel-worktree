name: PHPStan

# `pull_request`, because this is a required check and it was `push`-only: it
# never reported on a pull request at all, and requiring a check that cannot
# report blocks the branch permanently.
#
# No path filters, for the same reason — a README-only pull request would leave
# the check pending forever. `push` narrows to `main`, since a branch push is
# already covered by the pull request it needs before it can merge.
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  phpstan:
    name: phpstan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@v4

      - name: Run PHPStan
        run: ./vendor/bin/phpstan --error-format=github
