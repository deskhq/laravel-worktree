name: run-tests

# No path filters, deliberately. A required check is required of every pull
# request, and a workflow that a README-only change does not trigger leaves that
# check pending forever — nothing to report is not the same as reporting green.
# Every pull request runs the matrix; the cost of that is a few runner-minutes.
#
# `push` is narrowed to `main` for the opposite reason: a branch push is already
# covered by the pull request that has to exist before it can merge, so running
# both only duplicates every job. What remains is the run on `main` itself,
# which is what release-please cuts a tag from.
on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: true
      matrix:
        # POSIX only: the host binary needs pcntl for its signal handling, and
        # git worktrees, docker and the sibling worktrees directory are all
        # host-shaped in a way Windows is not.
        os: [ubuntu-latest]
        php: [8.5, 8.4]
        laravel: [13.*, 12.*]
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: 13.*
            testbench: 11.*
          - laravel: 12.*
            testbench: 10.*

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show -D

      # Nothing in this suite may need a daemon: every Docker interaction is
      # asserted through a fake binary that records its argv and replays canned
      # output, so the suite runs on a laptop with Docker Desktop closed. A
      # runner with the daemon up would not prove that.
      - name: Stop the Docker daemon
        run: |
          sudo systemctl stop docker.socket docker.service
          ! docker info > /dev/null 2>&1

      - name: Execute tests
        run: vendor/bin/pest --ci

      # Again with a process per file, which is the order that catches a case
      # depending on state — or on a helper — another file left behind.
      - name: Execute tests in parallel
        run: vendor/bin/pest --ci --parallel

  # The one name branch protection requires.
  #
  # A required check is matched by job name, and the matrix above produces eight
  # of them — `P8.5 - L13.* - prefer-stable - ubuntu-latest`, and so on — so
  # every edit to the matrix would invalidate the required list and, until
  # somebody noticed, block `main` on a check that no longer runs. This job's
  # name never changes.
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 1
    needs: test
    # `always()`, so a matrix that failed or was cancelled still reports here.
    # Without it this job would be skipped, and a skipped required check is one
    # that never reports.
    if: always()
    steps:
      - name: Require every matrix job to have succeeded
        env:
          RESULT: ${{ needs.test.result }}
        run: |
          echo "The test matrix reported: $RESULT"
          [ "$RESULT" = 'success' ]
