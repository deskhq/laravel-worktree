name: Fix PHP code style issues

# Everywhere but `main`. Note that the commit this job makes arrives with no
# checks on it: GitHub does not start a workflow run for a push made with its
# own `GITHUB_TOKEN`, so a pull request that gets styled here sits waiting on
# required checks that will never start, until they are re-run by hand or
# something else is pushed. `composer format` before pushing avoids it entirely.
#
# This job commits straight back to the branch it ran
# on, and once `main` requires a pull request that push is rejected — a red run
# on every merge, for a commit that could not have landed unstyled anyway,
# because the branch it came from was styled here first.
on:
  push:
    branches-ignore:
      - main
    paths:
      - '**.php'

permissions:
  contents: write

jobs:
  php-code-styling:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Fix PHP code style issues
        uses: aglipanci/laravel-pint-action@2.6

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Fix styling
